<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>REGISTER WITH THE SYSTEM</h1>
        <p class="subtitle">Please enter your information completely</p>
        
        <form id="registerForm">
            <div class="row">
                <input type="text" id="firstName" placeholder="Name (Max. 30 characters)" required>
                <input type="text" id="lastName" placeholder="Surname (Max. 30 characters)" required>
            </div>
            
            <input type="email" id="email" placeholder="Email Address" required>
            
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" required>
            
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Password (Again)" required>
            
            <button type="submit">SIGN UP</button>
        </form>

        <div id="messageBox"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
